# Copy nguyên văn từ upstream sgtaziz/lian-li-linux
# (packaging/tmpfiles.d/lianli.conf). Bắt buộc vì daemon từ chối khởi động khi
# không mở được /run/lianli-daemon.lock.
#
# `f` (không phải `f+` hay `L+`): chỉ tạo khi thiếu, không đụng file đang tồn
# tại — daemon đang giữ flock trên inode đó. Upstream cũng từ chối lock là
# symlink. Mode 0666 để cả daemon user-mode lẫn account `lianli` (system mode)
# mở được cùng một file và chia sẻ một flock.
f /run/lianli-daemon.lock 0666 root root - -
f /run/lianli-control.lock 0666 root root - -
