# Copy nguyên văn từ upstream sgtaziz/lian-li-linux
# (packaging/sysusers.d/lianli.conf).
#
# Cần group `lianli` vì /usr/lib/udev/rules.d/60-lianli.rules của gói dùng
# GROUP="lianli" ở mọi dòng. Gọi systemd-sysusers là bắt buộc — không có
# `u`/`m` trong /etc/passwd và /etc/group thì lệnh usermod -aG i2c,lianli sẽ
# abort với `group 'lianli' does not exist`.
#
# User `lianli` chỉ cần khi chuyển sang system mode; user mode thì chỉ dùng
# group, nhưng cài cả hai thì không tốn gì và mở sẵn đường chuyển mode.
u lianli - "Lian Li Linux daemon"
